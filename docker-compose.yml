services:
  db:
    image: postgres:16-alpine
    container_name: footbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: footbooking-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-paytech}
      PAYMENT_COMMISSION_PERCENT: ${PAYMENT_COMMISSION_PERCENT:-3}
      PAYTECH_API_KEY: ${PAYTECH_API_KEY:-}
      PAYTECH_API_SECRET: ${PAYTECH_API_SECRET:-}
      PAYTECH_ENV: ${PAYTECH_ENV:-test}
      PAYTECH_IPN_URL: ${PAYTECH_IPN_URL:-}
      FAKE_REFUND_MODE: ${FAKE_REFUND_MODE:-accepted}
      APP_NOTIFICATION_SENDER: ${APP_NOTIFICATION_SENDER:-}
      NOTIFICATION_FAKE_MODE: ${NOTIFICATION_FAKE_MODE:-accepted}
      NOTIFICATION_RETRY_MINUTES: ${NOTIFICATION_RETRY_MINUTES:-5}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      REMINDER_POLL_MS: ${REMINDER_POLL_MS:-300000}
    ports:
      - "8080:8080"

volumes:
  pgdata:
