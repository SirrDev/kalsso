spring:
  application:
    name: footbooking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/footbooking}
    username: ${DB_USER:footbooking}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    error:
      include-message: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change_me_with_a_very_long_random_secret_key_32chars_min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  payment:
    provider: ${PAYMENT_PROVIDER:paytech}
    commission-percent: ${PAYMENT_COMMISSION_PERCENT:3}
    hold-minutes: ${PAYMENT_HOLD_MINUTES:15}
    fake-refund-mode: ${FAKE_REFUND_MODE:accepted}
    refund:
      max-attempts: ${REFUND_MAX_ATTEMPTS:8}
      retry-minutes: ${REFUND_RETRY_MINUTES:10}
      poll-ms: ${REFUND_POLL_MS:60000}
  booking:
    reminder-poll-ms: ${REMINDER_POLL_MS:300000}
  notification:
    fake-mode: ${NOTIFICATION_FAKE_MODE:accepted}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    retry-minutes: ${NOTIFICATION_RETRY_MINUTES:5}
    poll-ms: ${NOTIFICATION_POLL_MS:30000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  paytech:
    base-url: https://paytech.sn/api
    api-key: ${PAYTECH_API_KEY:}
    api-secret: ${PAYTECH_API_SECRET:}
    env: ${PAYTECH_ENV:test}
    ipn-url: ${PAYTECH_IPN_URL:}
    success-url: ${PAYTECH_SUCCESS_URL:}
    cancel-url: ${PAYTECH_CANCEL_URL:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
